<!--SKYSPIKE-GAME v11-->
<title>SkySpike</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Inter:wght@500;600;700;800&family=Saira+Condensed:wght@500;600;700;800&display=swap">
<style>
/* Layout: phone-first column; a night arena — ink-black stands, teal court under spotlights, lightning-yellow trails, red home vs cyan away. Bottom tab bar; matches go full-screen with a touch pad. */
:root{
  --bg:#0c1018; --panel:#141a24; --panel2:#1b2430; --line:#303b4a;
  --fg:#f5f4f0; --muted:#9ba7b5; --accent:#ffcf3c; --cta:#ff9335;
  --home:#ed4c56; --away:#58cfe8; --good:#5cd18a; --bad:#ed4c56;
  --display:'Anton',Impact,'Arial Narrow',sans-serif;
  --body:'Barlow Condensed','Roboto Condensed','Arial Narrow',system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:17px;font-weight:500;line-height:1.3;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.02em;font-style:italic;text-transform:uppercase}
.num{font-variant-numeric:tabular-nums}
#app{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 104px}
body.in-match #app{padding-block:6px 10px;max-width:980px}
body.in-match .top,body.in-match .tabs{display:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px}
.logo{display:flex;align-items:baseline;gap:8px}
.logo h1{font-size:26px;line-height:1}
.logo h1 span{color:var(--accent)}
.logo small{font-size:13px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.wallet{display:flex;gap:8px}
.coin{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 6px;font-weight:700;font-size:15px}
.coin i{width:16px;height:16px;border-radius:50%;background:var(--accent);box-shadow:inset -2px -2px 0 #c98a10;display:block}
.coin i.ball{background:#fff;box-shadow:inset -2px -2px 0 #3d7bff}
.view{display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.sec-head h2{font-size:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;font-weight:700;font-size:18px;letter-spacing:.03em;text-transform:uppercase;background:var(--panel2);border:1px solid var(--line);transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:#2a1d00;border-color:#ffe08a;box-shadow:0 4px 0 #b9820c;font-family:var(--display);font-style:italic;font-weight:400;letter-spacing:.06em}
.btn.home{background:var(--cta);color:#1f0f00;border-color:#ffb066;box-shadow:0 4px 0 #b25d14;font-family:var(--display);font-style:italic;font-weight:400;letter-spacing:.06em}
.btn.small{padding:7px 12px;font-size:15px;border-radius:10px}
.btn[disabled]{opacity:.4;pointer-events:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{padding:9px;border-radius:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
/* team */
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.slot{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0}
.slot>.role-tag{position:absolute;top:12px;right:12px}
.slot img{width:100%;aspect-ratio:1;border-radius:10px;display:block;image-rendering:auto}
.slot .nm{font-weight:700;font-size:17px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .meta{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.slot .swap{font-size:13px;color:var(--accent);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.role-tag{font-size:12px;font-weight:700;padding:2px 7px;border-radius:6px;color:#0c1f24;letter-spacing:.06em}
.rank{font-family:var(--display);font-size:13px;padding:1px 6px;border-radius:6px;color:#101a1d;line-height:1.3}
.r-SP{background:linear-gradient(90deg,#ffc93c,#ff7a5c,#c77dff)}
.ovr-band{display:flex;align-items:center;gap:18px;background:linear-gradient(100deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:14px 16px;flex-wrap:wrap}
.ovr-band .big{font-family:var(--display);font-size:40px;line-height:1;color:var(--accent)}
.ovr-band .lbl{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.ovr-band b.v{font-family:var(--display);font-weight:400;font-size:20px}
.ovr-band .rec{margin-left:auto;display:flex;gap:18px;text-align:right;flex-wrap:wrap}
.hint{color:var(--muted);font-size:15px;max-width:62ch;margin:0}
.court-mini{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:8px}
.court-mini dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:15px}
.court-mini dt{font-weight:700}
.court-mini dd{margin:0;color:var(--muted)}
/* gacha */
.banner{position:relative;overflow:hidden;border-radius:18px;border:1px solid var(--line);background:
  repeating-linear-gradient(115deg,rgba(255,201,60,.08) 0 14px,transparent 14px 28px),
  radial-gradient(120% 90% at 85% 10%,#3a2a6b 0%,transparent 60%),
  linear-gradient(160deg,#1b2a3e,#0c1018);padding:18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:end;min-height:180px}
.banner h2{font-size:30px;line-height:1}
.banner p{margin:6px 0 0;color:var(--muted);max-width:34ch}
.banner .feat{display:flex;padding-right:6px}
.banner .feat img{width:84px;height:84px;border-radius:12px;border:2px solid var(--accent);image-rendering:auto;margin-left:-22px;background:#000;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.banner .feat img:first-child{margin-left:0;transform:rotate(-6deg)}
.banner .feat img:last-child{transform:rotate(6deg)}
.pull-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pull-row .btn{padding:16px 10px;flex-direction:column;gap:2px}
.pull-row .btn small{font-family:var(--body);font-size:14px;text-transform:none;letter-spacing:0;opacity:.85}
.rates{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;text-align:center;font-size:14px}
.rates div{background:var(--panel);border-radius:10px;padding:6px 2px;border:1px solid var(--line)}
.rates b{display:block;font-family:var(--display);font-weight:400;font-size:15px}
.results{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.pull{perspective:600px}
.pull .in{position:relative;border-radius:10px;overflow:hidden;animation:flip .5s both;animation-delay:calc(var(--i)*90ms);border:2px solid var(--rc,#9aa3a8);background:#000}
.pull img{display:block;width:100%;aspect-ratio:1;image-rendering:auto}
.pull .tag{position:absolute;left:0;right:0;bottom:0;font-size:12px;font-weight:700;text-align:center;background:rgba(0,0,0,.65);padding:1px 0;letter-spacing:.05em}
.pull .tag.new{color:var(--accent)}
.pull .rk{position:absolute;top:3px;left:3px}
.pull.hi .in{box-shadow:0 0 0 2px var(--rc),0 0 22px var(--rc)}
@keyframes flip{from{transform:rotateY(90deg) scale(.8);opacity:0}to{transform:none;opacity:1}}
/* roster */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.card img{width:100%;aspect-ratio:1;border-radius:8px;display:block;image-rendering:auto}
.card .rk{position:absolute;top:10px;left:10px}
.card .rt{position:absolute;top:10px;right:10px}
.card .nm{font-weight:700;font-size:15px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .lv{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.card.locked{opacity:.38}
.card.locked img{filter:brightness(0) opacity(.6)}
.card.in-team{border-color:var(--accent)}
.stars{color:var(--accent);letter-spacing:-1px;font-size:13px}
.stars i{font-style:normal;color:#3a5a60}
/* sheet */
.sheet{position:fixed;inset:0;z-index:30;background:rgba(3,12,15,.66);display:flex;align-items:flex-end;justify-content:center}
.sheet .pan{width:100%;max-width:560px;max-height:90%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.det-head{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;align-items:center}
.det-head img{width:120px;height:120px;border-radius:14px;image-rendering:auto;border:2px solid var(--rc)}
.det-head h3{font-size:22px;line-height:1.05}
.det-head .ttl{color:var(--muted);font-style:italic}
.lvl-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lvl-row .lv{font-family:var(--display);font-size:22px;margin-right:auto}
.lvl-row .lv small{font-family:var(--body);font-size:14px;color:var(--muted)}
.statrows{display:grid;gap:7px}
.srow{display:grid;grid-template-columns:72px minmax(0,1fr) 44px 34px;align-items:center;gap:8px;font-size:15px}
.srow .bar{height:10px;background:#0a0e15;border-radius:5px;overflow:hidden}
.srow .bar i{display:block;height:100%;border-radius:5px;background:var(--fg)}
.srow .v{text-align:right;font-weight:700}
.srow button{width:34px;height:28px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);font-weight:700}
.srow button[disabled]{opacity:.25}
.trait{background:var(--panel2);border-radius:12px;padding:10px 12px;font-size:15px;border-left:3px solid var(--accent)}
.trait b{display:block;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.trait.ult{border-left-color:#c77dff}
.trait.ult b{color:#d8a6ff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pick-list{display:grid;gap:8px}
.pick{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:6px 10px 6px 6px;text-align:left}
.pick img{width:52px;height:52px;border-radius:8px;image-rendering:auto}
.pick .o{font-family:var(--display);font-size:20px}
.pick.cur{border-color:var(--accent)}
/* setup */
.diffs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.diff{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.diff[aria-pressed="true"]{border-color:var(--away);box-shadow:inset 0 0 0 1px var(--away)}
.diff h3{font-size:16px}
.diff .sub{font-size:14px;color:var(--muted)}
.diff .faces{display:flex;gap:4px}
.diff .faces img{width:34px;height:34px;border-radius:7px;image-rendering:auto}
.diff .o{font-family:var(--display);font-size:18px;color:var(--away)}
.opt{display:grid;gap:8px}
details.howto{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
details.howto summary{font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
details.howto ul{margin:10px 0 0;padding-left:18px;display:grid;gap:4px;font-size:15px;color:var(--muted)}
details.howto b{color:var(--fg)}
kbd{font-family:var(--body);font-weight:700;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:0 5px;color:var(--fg)}
.bracket{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rnd{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.rnd.cur{border-color:var(--accent)}
.rnd.done{opacity:.6}
.rnd .eyebrow{font-size:11px}
.rnd b{font-size:15px;line-height:1.1;overflow:hidden;text-overflow:ellipsis}
.rnd .faces{display:flex;gap:3px}
.rnd .faces img{width:26px;height:26px;border-radius:5px;image-rendering:auto}
.trophy{display:inline-flex;align-items:center;gap:4px;font-weight:700}
.trophy svg{width:18px;height:18px}
/* match — full-screen landscape stage, HUD floats over the picture */
body.in-match{overflow:hidden;overscroll-behavior:none}
#m-play{position:fixed;inset:0;z-index:25;background:#0c1018;user-select:none;-webkit-user-select:none;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud-top{position:absolute;top:calc(6px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;justify-content:center;pointer-events:none;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.sb{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;width:min(560px,74vw);pointer-events:auto}
.sb-team{display:flex;flex-direction:column;gap:3px;min-width:0}
.sb-team .nm{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #000}
.sb-team.r{align-items:flex-end;text-align:right}
.sb-team .bar{display:block;height:9px;width:100%;background:rgba(5,7,11,.75);border:1px solid rgba(255,255,255,.18);transform:skewX(-20deg);overflow:hidden}
.sb-team .bar b{display:block;height:100%;width:0%;transition:width .3s}
.sb-team.l .bar b{background:linear-gradient(90deg,#a8303b,#ed4c56)}
.sb-team.r .bar b{background:linear-gradient(270deg,#22718f,#58cfe8);margin-left:auto}
.sb-mid{display:flex;align-items:center;gap:8px;padding:0 10px}
.sb-mid .pts{font-family:var(--display);font-style:italic;font-size:26px;line-height:1;text-shadow:0 2px 4px #000;min-width:28px;text-align:center}
.sb-mid .pts.h{color:#ff8a8a}.sb-mid .pts.a{color:#9fe6f6}
.vs{position:relative;width:44px;height:30px;display:grid;place-items:center;background:var(--accent);color:#1f1400;font-family:var(--display);font-style:italic;font-size:15px;clip-path:polygon(18% 0,82% 0,100% 50%,82% 100%,18% 100%,0 50%);line-height:1}
.vs small{position:absolute;bottom:-15px;left:50%;transform:translateX(-50%);font-family:var(--body);font-style:normal;font-size:11px;font-weight:700;color:var(--fg);white-space:nowrap;text-shadow:0 1px 2px #000}
.srv{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);visibility:hidden;box-shadow:0 0 6px var(--accent)}
.srv.on{visibility:visible}
.sysbtn{position:absolute;top:calc(6px + env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));width:42px;height:42px;border-radius:50%;background:rgba(12,16,24,.6);border:1px solid rgba(255,255,255,.25);display:grid;place-items:center;pointer-events:auto}
.sysbtn svg{width:18px;height:18px}
.skills{position:absolute;top:22%;display:flex;flex-direction:column;gap:10px;pointer-events:auto}
.skills.left{left:max(10px,env(safe-area-inset-left,0px))}
.skills.right{right:max(10px,env(safe-area-inset-right,0px))}
.skb{position:relative;width:50px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--fg)}
.skb i{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgba(12,16,24,.55);border:2px solid rgba(245,244,240,.7);transition:transform .1s}
.skb i svg{width:24px;height:24px}
.skb span{font-size:10px;font-weight:700;letter-spacing:.02em;text-shadow:0 1px 2px #000;white-space:nowrap}
.skb.armed i{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,207,60,.35),0 0 18px rgba(255,207,60,.7);animation:pulse .5s infinite alternate}
.skb.cd i{opacity:.45}
.skb.off i{opacity:.35;border-style:dashed;transform:scale(.86)}.skb.off span{opacity:.5}
.skb.eq i{border-color:#fff}
.skb em{position:absolute;top:13px;left:0;right:0;text-align:center;font-style:normal;font-family:var(--display);font-size:18px;color:#fff;text-shadow:0 1px 3px #000;pointer-events:none}
.skb:active i{transform:scale(.92)}
.mtip{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom,0px));max-width:min(520px,46vw);text-align:center;font-size:13px;font-weight:600;color:var(--fg);text-shadow:0 1px 3px #000;pointer-events:none}
.mtip b{color:var(--accent)}
.ultbar{position:absolute;left:50%;transform:translateX(-50%);top:calc(56px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.1em;color:#d8a6ff;pointer-events:none;text-shadow:0 1px 2px #000}
.ultbar i{display:block;width:80px;height:7px;border-radius:4px;background:rgba(5,7,11,.7);overflow:hidden}
.ultbar i b{display:block;height:100%;background:linear-gradient(90deg,#8e5cff,#ff7ad9);width:0%}
.ultbar.full i b{animation:pulse .6s infinite alternate}
@keyframes pulse{to{filter:brightness(1.6)}}
.ctrl-l{position:absolute;left:0;bottom:0;width:46%;height:42%;padding:0 0 env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);touch-action:none}
.stickzone{position:absolute;inset:0;touch-action:none}
.stickzone>span{position:absolute;left:max(24px,env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));font-family:var(--display);font-style:italic;color:rgba(245,244,240,.35);letter-spacing:.08em;pointer-events:none;font-size:14px;line-height:1.15}
.stickzone>span small{font-family:var(--body);font-style:normal;font-size:11px;letter-spacing:.03em}
.stickbase{position:absolute;left:90px;bottom:70px;width:104px;height:104px;margin:0 0 -52px -52px;border-radius:50%;border:2px solid rgba(245,244,240,.35);background:rgba(12,16,24,.35);pointer-events:none;opacity:.55;transition:opacity .12s}
.stickbase.on{opacity:1}
.stickknob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#c9d2dc);box-shadow:0 0 16px rgba(255,207,60,.45)}
.acts{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;gap:10px;align-items:end;justify-items:center}
.acts .feint{grid-column:1;grid-row:1}.acts .jump{grid-column:1;grid-row:2}.acts .act{grid-column:2;grid-row:1/3}
.kbtn{width:64px;height:64px;border-radius:50%;background:rgba(12,16,24,.5);border:2px solid rgba(245,244,240,.65);display:grid;place-items:center;color:var(--fg);font-family:var(--display);font-size:14px;font-style:italic;letter-spacing:.04em;touch-action:none;-webkit-touch-callout:none;text-shadow:0 1px 2px #000}
.kbtn.on{transform:scale(.93);background:rgba(255,255,255,.18)}
.kbtn.jump{border-color:#58cfe8;background:rgba(29,95,115,.55)}
.kbtn.act{width:86px;height:86px;background:rgba(255,147,53,.78);color:#1f0f00;border-color:#ffd0a0;font-size:16px;text-shadow:none;box-shadow:0 0 22px rgba(255,147,53,.35)}
.kbtn.feint{width:50px;height:50px;font-size:11px}

/* summon sequence */
.sum{position:fixed;inset:0;z-index:60;background:radial-gradient(120% 90% at 50% 40%,#16306a 0%,#060b18 70%);overflow:hidden;display:grid;place-items:center;touch-action:manipulation;--sc:#fff}
.sum .rays{position:absolute;left:50%;top:42%;width:220vmax;height:220vmax;margin:-110vmax 0 0 -110vmax;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.0) 0 7deg,var(--sc) 7deg 9deg);opacity:0;mask:radial-gradient(circle,#000 0,transparent 55%);-webkit-mask:radial-gradient(circle,#000 0,transparent 55%);animation:spin 9s linear infinite}
.sum.hit .rays{opacity:.28;transition:opacity .3s}
@keyframes spin{to{transform:rotate(360deg)}}
.sum .orb{position:absolute;left:50%;top:42%;width:92px;height:92px;margin:-46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 18%,#ffe9a8 30%,#3d7bff 70%,#1a2f7a);box-shadow:0 0 40px 10px var(--sc),0 0 120px 30px var(--sc);animation:orbin 1.15s cubic-bezier(.3,.1,.5,1) both}
.sum .orb::before,.sum .orb::after{content:'';position:absolute;inset:8px;border-radius:50%;border:3px solid rgba(255,255,255,.7);border-left-color:transparent;border-right-color:transparent;animation:spin .35s linear infinite}
.sum .orb::after{inset:-14px;border-width:2px;animation-duration:.6s;animation-direction:reverse}
@keyframes orbin{0%{transform:translateY(-70vh) scale(.5)}55%{transform:translateY(0) scale(1)}70%{transform:translateY(-6vh) scale(1.05)}85%{transform:translateY(0) scale(1.25)}100%{transform:scale(1.6);opacity:0}}
.sum .flash{position:absolute;inset:0;background:var(--sc);opacity:0;pointer-events:none}
.sum.hit .flash{animation:fl .55s ease-out}
@keyframes fl{0%{opacity:.95}100%{opacity:0}}
.sum .ring{position:absolute;left:50%;top:42%;width:40px;height:40px;margin:-20px;border-radius:50%;border:6px solid var(--sc);opacity:0}
.sum.hit .ring{animation:rg .7s ease-out}
@keyframes rg{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(28)}}
.sum .deck{position:relative;z-index:2;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;width:min(720px,94vw)}
.sum .deck.one{grid-template-columns:minmax(0,180px);justify-content:center}
.sum .sc{perspective:700px;opacity:0;transform:translateY(40px) scale(.6)}
.sum .sc.in{opacity:1;transform:none;transition:transform .35s cubic-bezier(.2,1.4,.4,1),opacity .2s}
.sum .sc .fl{position:relative;aspect-ratio:3/4;transform-style:preserve-3d;transition:transform .45s ease-out}
.sum .sc.open .fl{transform:rotateY(180deg)}
.sum .sc .bk,.sum .sc .fr{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:2px solid rgba(255,255,255,.8);clip-path:polygon(10% 0,100% 0,100% 90%,90% 100%,0 100%,0 10%)}
.sum .sc .bk{background:repeating-linear-gradient(135deg,#1a3f8f 0 8px,#143272 8px 16px);display:grid;place-items:center;font-family:var(--display);font-style:italic;font-size:15px;color:#cfe0ff;box-shadow:inset 0 0 0 4px #0c1f4d}
.sum .sc .bk::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,var(--rc,transparent) 50%,transparent 70%);opacity:.0}
.sum .sc.tease .bk::after{opacity:.9;animation:sh .8s linear infinite}
@keyframes sh{from{transform:translateX(-60%)}to{transform:translateX(60%)}}
.sum .sc .fr{transform:rotateY(180deg);background:#000;display:flex;flex-direction:column;border-color:var(--rc)}
.sum .sc .fr img{width:100%;aspect-ratio:1;display:block}
.sum .sc .fr .nm{flex:1;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;line-height:1;padding:0 4px;text-align:center;background:linear-gradient(#111,#000)}
.sum .sc .fr .rk{position:absolute;top:4px;left:4px}
.sum .sc .fr .tg{position:absolute;top:4px;right:4px;font-size:10px;font-weight:700;background:rgba(0,0,0,.7);padding:1px 4px;color:var(--accent)}
.sum .sc.hi.open .fr{box-shadow:0 0 0 2px var(--rc),0 0 30px var(--rc)}
.sum .cut{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:rgba(4,8,18,.6);opacity:0;pointer-events:none;transition:opacity .2s}
.sum .cut.on{opacity:1}
.sum .cut .band{position:absolute;left:-10%;right:-10%;top:50%;height:46%;transform:translateY(-50%) skewY(-8deg);background:linear-gradient(90deg,transparent,var(--rc) 20%,var(--rc) 80%,transparent);opacity:.85}
.sum .cut .who{position:relative;display:flex;align-items:center;gap:18px;transform:translateX(60vw);transition:transform .45s cubic-bezier(.2,1.2,.4,1)}
.sum .cut.on .who{transform:none}
.sum .cut img{width:min(42vw,220px);aspect-ratio:1;border:4px solid #fff;transform:rotate(-4deg);box-shadow:0 14px 40px rgba(0,0,0,.5)}
.sum .cut .txt{display:flex;flex-direction:column;gap:4px;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.sum .cut .txt b{font-family:var(--display);font-style:italic;font-size:clamp(40px,9vw,80px);line-height:.9;color:#fff}
.sum .cut .txt span{font-family:var(--display);font-style:italic;font-size:clamp(20px,4.5vw,34px);line-height:1;color:#fff;text-transform:uppercase}
.sum .cut .txt small{font-size:15px;font-weight:700;color:#fff;letter-spacing:.1em;text-transform:uppercase}
.sum .foot{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:6}
.sum .skip{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));z-index:6;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#cfe0ff;font-size:14px}

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a=0,b=1)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ================= DATA ================= */
const RANKS={C:{base:40,rate:42,color:'#9aa3a8'},B:{base:52,rate:30,color:'#5cc56b'},A:{base:64,rate:18,color:'#4aa3ff'},S:{base:78,rate:8,color:'#c77dff'},'S+':{base:92,rate:2,color:'#ffc93c'}};
const JERSEY={SPK:4,SET:7,DEF:11};const jerseyOf=c=>c.num||JERSEY[c.role];
const RANK_ORDER=['S+','S','A','B','C'];

const PROFILE={SPK:{atk:1.28,saut:1.15,vit:1.0,def:0.78,passe:0.62},SET:{atk:0.72,saut:0.9,vit:1.12,def:0.92,passe:1.38},DEF:{atk:0.76,saut:1.12,vit:0.98,def:1.36,passe:0.8}};
const STATS=[['atk','Attaque'],['saut','Saut'],['vit','Vitesse'],['def','Défense'],['passe','Passe']];
const MAXLV=60,MAXSTAR=5,PTS_PER_LV=2,PT_VALUE=2;
const T=(k,v,label)=>({k,v,label});
const ROSTER=[
 {id:'vex',name:'Vex Halloran',title:"L'Orage",role:'SPK',rank:'S+',skin:'#e7b089',hair:'#f4f4f4',style:0,band:'#ff5a3c',trait:T('perfectPow',0.3,'Foudre : +30 % de puissance sur un smash parfait')},
 {id:'kira',name:'Kira Volkov',title:'La Tsarine',role:'SPK',rank:'S+',skin:'#f5d8c6',hair:'#b9e0ff',style:3,band:'#3d7bff',trait:T('pow',0.2,'Avalanche : +20 % de puissance de smash')},
 {id:'mira',name:'Mira Sato',title:'Lune Noire',role:'SET',rank:'S+',skin:'#f2cba8',hair:'#1c1b2e',style:3,band:'#c77dff',trait:T('set',0.25,'Éclipse : passes 25 % plus précises')},
 {id:'bram',name:'Bram Okonkwo',title:"Mur d'Acier",role:'DEF',rank:'S+',skin:'#6a432e',hair:'#141210',style:2,band:'#ffc93c',trait:T('block',0.16,'Rempart : +16 % de chance de contre')},
 {id:'jun',name:'Jun Hayase',title:'Comète',role:'SPK',rank:'S',skin:'#f0c8a0',hair:'#ff8a3d',style:4,trait:T('pow',0.12,'Traînée : +12 % de puissance de smash')},
 {id:'noa',name:'Noa Lindqvist',title:'Lame du Nord',role:'SPK',rank:'S',skin:'#f6d7c0',hair:'#ead57d',style:1,band:'#3d7bff',trait:T('reach',0.25,'Envergure : saute 25 cm plus haut')},
 {id:'ines',name:'Inès Bellamy',title:"Chef d'orchestre",role:'SET',rank:'S',skin:'#c58a60',hair:'#3a2418',style:4,trait:T('set',0.18,'Tempo : passes 18 % plus précises')},

 {id:'mei',name:'Mei Lin',title:"L'Ombre",role:'DEF',rank:'S',skin:'#f3d4b8',hair:'#2b1f3a',style:1,band:'#5cd18a',trait:T('speed',0.18,'Ombre : +18 % de vitesse de course')},
 {id:'dario',name:'Dario Fenn',title:'Canon',role:'SPK',rank:'A',skin:'#d9a27a',hair:'#2b2b2b',style:2,band:'#ff5a3c',trait:T('serve',0.15,'Boulet : +15 % de puissance au service')},
 {id:'amara',name:'Amara Diallo',title:'Ressort',role:'SPK',rank:'A',skin:'#7a4b33',hair:'#0f0d0c',style:3,trait:T('reach',0.15,'Ressort : saute 15 cm plus haut')},
 {id:'yanis',name:'Yanis Belkacem',title:'Fusée',role:'SPK',rank:'A',skin:'#c7936a',hair:'#191210',style:0,trait:T('pow',0.08,'Fusée : +8 % de puissance de smash')},
 {id:'yuki',name:'Yuki Morimoto',title:"Fil d'argent",role:'SET',rank:'A',skin:'#f3d2b3',hair:'#c9ced6',style:1,trait:T('set',0.12,'Précision : passes 12 % plus précises')},
 {id:'enzo',name:'Enzo Moreau',title:'Le Métronome',role:'SET',rank:'A',skin:'#ecc19c',hair:'#8a5a2f',style:4,trait:T('speed',0.1,'Placement : +10 % de vitesse')},
 {id:'hugo',name:'Hugo Varenne',title:'Grand Mur',role:'DEF',rank:'A',skin:'#eec4a0',hair:'#6b4a2b',style:0,trait:T('block',0.1,'Tour : +10 % de chance de contre')},
 {id:'leo',name:'Léo Castel',title:'Plongeon',role:'DEF',rank:'A',skin:'#e0aa82',hair:'#a3542c',style:4,band:'#3fd0c9',trait:T('speed',0.12,'Réflexe : +12 % de vitesse de course')},
 {id:'sami',name:'Sami Roux',title:'Malin',role:'SPK',rank:'B',skin:'#c99068',hair:'#2a1b12',style:0,trait:T('feint',0.2,'Ruse : feintes 20 % plus précises')},
 {id:'zoe',name:'Zoé Marin',title:'Vent du large',role:'SPK',rank:'B',skin:'#f4d3b6',hair:'#d9572e',style:3,trait:T('pow',0.06,'Élan : +6 % de puissance de smash')},

 {id:'kenji',name:'Kenji Abe',title:'Calme',role:'SET',rank:'B',skin:'#e6be98',hair:'#1a1a1a',style:2,trait:T('set',0.08,'Toucher : passes 8 % plus précises')},
 {id:'theo',name:'Théo Marchal',title:'Roc',role:'DEF',rank:'B',skin:'#efc6a2',hair:'#4b3423',style:2,trait:T('dig',0.08,'Appuis : +8 % de contrôle en défense')},
 {id:'max',name:'Max Durand',title:'Le Débutant',role:'SPK',rank:'C',skin:'#f0c39c',hair:'#7a4f2a',style:0,trait:T('pow',0.04,'Motivé : +4 % de puissance')},
 {id:'remy',name:'Rémy Costa',title:'Le Bavard',role:'SPK',rank:'C',skin:'#d6a07a',hair:'#111111',style:4,trait:T('serve',0.06,'Grande gueule : +6 % au service')},
 {id:'eva',name:'Éva Lenoir',title:'La Studieuse',role:'SET',rank:'C',skin:'#f6dac4',hair:'#e3c06a',style:3,trait:T('set',0.05,'Appliquée : passes 5 % plus précises')},
 {id:'paul',name:'Paul Vidal',title:'Le Solide',role:'DEF',rank:'C',skin:'#e9b993',hair:'#5b3b25',style:2,trait:T('dig',0.05,'Patient : +5 % de contrôle en défense')},
 {id:'jade',name:'Jade Morel',title:'La Grande',role:'DEF',rank:'C',skin:'#8a5a3e',hair:'#1b1210',style:1,trait:T('block',0.04,'Bras longs : +4 % de contre')},
];
const BY_ID=Object.fromEntries(ROSTER.map(c=>[c.id,c]));
const ULT_KIND={perfectPow:'atk',pow:'atk',reach:'atk',serve:'atk',feint:'atk',set:'set',block:'block',dig:'dig',speed:'dig'};
const ULT_DESC={atk:'son prochain smash ou service part 50 % plus fort et traverse presque tous les contres',set:'sa prochaine passe est parfaite et offre un smash parfait à son attaquant',block:'son prochain contre est quasi infranchissable',dig:'sa prochaine réception ou défense est parfaite, même en plongeon'};
const hasUlt=c=>c.rank==='S'||c.rank==='S+';
const ultName=c=>c.trait.label.split(' :')[0];

function baseStats(c){const r=mulberry(hash(c.id)),b=RANKS[c.rank].base,p=PROFILE[c.role],o={};for(const[k]of STATS)o[k]=Math.round(b*p[k]*(0.9+r()*0.2));return o}
function effStats(id,own){const c=BY_ID[id],bs=baseStats(c),m=(1+(own.lvl-1)*0.025)*(1+0.06*own.stars),o={};for(const[k]of STATS)o[k]=Math.round(bs[k]*m+((own.alloc&&own.alloc[k])||0)*PT_VALUE);return o}
function ovr(id,st){const p=PROFILE[BY_ID[id].role];let a=0,w=0;for(const[k]of STATS){a+=st[k]*p[k];w+=p[k]}return Math.round(a/w)}
function ptsLeft(own){let used=0;for(const[k]of STATS)used+=(own.alloc&&own.alloc[k])||0;return (own.lvl-1)*PTS_PER_LV-used}
function autoAlloc(id,own){const p=PROFILE[BY_ID[id].role];const ks=STATS.map(s=>s[0]).sort((a,b)=>p[b]-p[a]);const n=(own.lvl-1)*PTS_PER_LV;own.alloc={};own.alloc[ks[0]]=Math.ceil(n*0.5);own.alloc[ks[1]]=Math.floor(n*0.3);own.alloc[ks[2]]=n-own.alloc[ks[0]]-own.alloc[ks[1]];return own}

/* ================= STATE ================= */
const KEY='filet-libre-v1';
function fresh(){const o={};for(const id of['max','eva','paul','sami','lina'])o[id]={lvl:1,stars:0,alloc:{}};return{owned:o,team:{SPK:'max',SET:'eva',DEF:'paul'},pulls:0,wins:0,losses:0,last:[]}}
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!S||!S.owned||!S.team)S=fresh();
S.settings=Object.assign({sound:true,assist:true,role:'SPK'},S.settings||{});
if(!S.box)S.box=Math.max(15,Object.keys(S.owned).length);if(!S.wait)S.wait=[];
const boxUsed=()=>Object.keys(S.owned).length;
const boxMin=()=>Math.max(6,boxUsed());
const BOXMAX=ROSTER.length;
function claimWait(){let n=0;while(S.wait.length&&boxUsed()<S.box){const id=S.wait.shift();if(!S.owned[id]){S.owned[id]={lvl:1,stars:0,alloc:{}};n++}}if(n)toast(n+' perso'+(n>1?'s':'')+' en attente récupéré'+(n>1?'s':''));return n}
S.trophies=Object.assign({bronze:0,argent:0,or:0},S.trophies||{});
for(const id of Object.keys(S.owned))if(!BY_ID[id])delete S.owned[id];
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('on'),1500)}

/* ================= PORTRAITS & HEADS ================= */
const EYES=['#3b6fd8','#7a4a2a','#2f9e6e','#b0485b','#6a55c8','#2b2b2b','#c78a1e'];
const OUTL='#0b0f17';
function drawHead(g,c,cx,cy,r,face,detail){
  const ol=Math.max(1,r*0.09);
  g.lineJoin='round';g.strokeStyle=OUTL;g.lineWidth=ol;
  const fs=()=>{g.fill();g.stroke()};
  g.fillStyle=c.hair;
  if(c.style===3){g.beginPath();g.ellipse(cx-r*face*1.0,cy+r*0.15,r*0.34,r*0.78,face*0.25,0,7);fs()}
  if(c.style===1){g.beginPath();g.roundRect?g.roundRect(cx-r*1.08,cy-r*0.4,r*2.16,r*1.3,r*0.3):g.rect(cx-r*1.08,cy-r*0.4,r*2.16,r*1.3);fs()}
  // neck shadow + face
  g.fillStyle=c.skin;g.beginPath();g.ellipse(cx+face*r*0.05,cy+r*0.05,r*0.92,r*1.0,0,0,7);fs();
  // jaw point toward facing (anime chin)
  g.beginPath();g.moveTo(cx-face*r*0.55,cy+r*0.55);g.quadraticCurveTo(cx+face*r*0.5,cy+r*1.12,cx+face*r*0.86,cy+r*0.35);g.lineTo(cx+face*r*0.6,cy);g.closePath();g.fill();
  g.beginPath();g.moveTo(cx-face*r*0.55,cy+r*0.62);g.quadraticCurveTo(cx+face*r*0.5,cy+r*1.12,cx+face*r*0.86,cy+r*0.35);g.stroke();
  // ear
  g.beginPath();g.ellipse(cx-r*0.62*face,cy+r*0.12,r*0.16,r*0.22,0,0,7);fs();
  // hair top
  g.fillStyle=c.hair;g.beginPath();

let artBusy=false;
async function artLoad(){
  if(artBusy||!window.fetch)return;artBusy=true;let changed=false;
  const one=async id=>{
    try{
      const r=await fetch(ART_BASE+id+'.png',{cache:'no-cache'});
      if(r.status===404){if(ART[id]){delete ART[id];changed=true}return}
      if(!r.ok)return;
      const blob=await r.blob();if(!blob.size)return;
      const u=URL.createObjectURL(blob);
      await new Promise(res=>{const im=new Image();im.onload=()=>{const d=artCompose(id,im);if(d&&d!==ART[id]){ART[id]=d;changed=true}URL.revokeObjectURL(u);res()};im.onerror=()=>{URL.revokeObjectURL(u);res()};im.src=u});
    }catch(e){/* offline or blocked: keep cached / drawn portrait */}
  };
  const ids=ROSTER.map(c=>c.id);
  for(let i=0;i<ids.length;i+=6)await Promise.all(ids.slice(i,i+6).map(one));
  artBusy=false;
  if(changed){artSave();for(const k in PIMG)delete PIMG[k];if(!M.active)({team:renderTeam,gacha:()=>renderGacha(),roster:renderRoster,match:renderSetup})[curView]()}

function rollRank(){let r=Math.random()*100;for(const k of RANK_ORDER){r-=RANKS[k].rate;if(r<0)return k}return'C'}
function rollOne(minA){let rk=rollRank();if(minA&&(rk==='B'||rk==='C'))rk='A';return pick(ROSTER.filter(c=>c.rank===rk)).id}
function doPull(n){
  const res=[];for(let i=0;i<n;i++)res.push(rollOne());
  if(n===10&&!res.some(id=>['A','S','S+'].includes(BY_ID[id].rank)))res[9]=rollOne(true);
  S.last=res.map(id=>{let tag;if(!S.owned[id]&&S.wait.includes(id)){tag='EN ATTENTE'}else if(!S.owned[id]&&boxUsed()>=S.box){S.wait.push(id);tag='EN ATTENTE'}else if(!S.owned[id]){S.owned[id]={lvl:1,stars:0,alloc:{}};tag='NOUVEAU'}else if(S.owned[id].stars<MAXSTAR){S.owned[id].stars++;tag='+1 ★'}else tag='MAX ★';return{id,tag}});
  S.pulls+=n;save();
  playSummon(S.last,()=>renderGacha(false));
}

/* summon sequence: ball drop -> impact coloured by best rank -> cards fly in -> flip -> cut-in for S / S+ */
const RKORDER=['C','B','A','S','S+'];
function playSummon(list,done){
  const ranks=list.map(r=>BY_ID[r.id].rank),best=ranks.reduce((a,b)=>RKORDER.indexOf(b)>RKORDER.indexOf(a)?b:a,'C');
  const sc={C:'#cfd6de',B:'#5cd18a',A:'#4aa3ff',S:'#c77dff','S+':'#ffcf3c'}[best];
  const el=document.createElement('div');el.className='sum';el.style.setProperty('--sc',sc);
  el.innerHTML=`<div class="rays"></div><div class="flash"></div><div class="ring"></div><div class="orb"></div>
    <div class="deck ${list.length===1?'one':''}">${list.map((r,i)=>{const c=BY_ID[r.id],rc=RANKS[c.rank].color;return`<div class="sc ${hasUlt(c)?'hi':''}" style="--rc:${rc}" data-i="${i}"><div class="fl"><div class="bk">SKY<br>SPIKE</div><div class="fr"><img src="${portrait(r.id)}" alt=""><span class="rk">${rankBadge(c.rank)}</span><span class="tg">${r.tag}</span><div class="nm">${esc(c.name)}</div></div></div></div>`}).join('')}</div>
    <div class="cut"><div class="band"></div><div class="who"></div></div>
    <button class="skip">Passer ›</button><div class="foot" hidden><button class="btn primary" data-ok>Continuer</button></div>`;
  document.body.appendChild(el);
  const T=[],at=(ms,f)=>T.push(setTimeout(f,ms));let finished=false;
  const cards=[...el.querySelectorAll('.sc')],cut=el.querySelector('.cut');
  const finish=()=>{if(finished)return;finished=true;T.forEach(clearTimeout);el.classList.add('hit');cut.classList.remove('on');cards.forEach(c=>c.classList.add('in','open'));el.querySelector('.skip').hidden=true;el.querySelector('.foot').hidden=false};
  try{sfx.summonDrop()}catch(e){}
  at(1000,()=>{el.classList.add('hit');try{sfx.summonHit(RKORDER.indexOf(best))}catch(e){};if(navigator.vibrate)try{navigator.vibrate(RKORDER.indexOf(best)>=3?[30,40,60]:20)}catch(e){}});
  let t=1350;cards.forEach((c,i)=>at(t+i*70,()=>{c.classList.add('in');if(RKORDER.indexOf(ranks[i])>=3)c.classList.add('tease')}));
  t+=cards.length*70+350;
  cards.forEach((c,i)=>{
    const big=RKORDER.indexOf(ranks[i])>=3;
    at(t,()=>{c.classList.remove('tease');c.classList.add('open');try{sfx.flip()}catch(e){}});
    if(big){const id=list[i].id,ch=BY_ID[id];
      at(t+380,()=>{cut.style.setProperty('--rc',RANKS[ch.rank].color);cut.querySelector('.who').innerHTML=`<img src="${portrait(id)}" alt=""><div class="txt"><small>${list[i].tag==='NOUVEAU'?'Nouvelle recrue':'Recrue'} · ${ROLES[ch.role].name}</small><b>${ch.rank}</b><span>${esc(ch.name)}</span><small>« ${esc(ch.title)} »</small></div>`;cut.classList.add('on');try{sfx.fanfare(RKORDER.indexOf(ch.rank))}catch(e){}});
      at(t+2100,()=>cut.classList.remove('on'));t+=2300;
    }else t+=list.length===1?200:140;
  });
  at(t+150,finish);
  el.querySelector('.skip').onclick=e=>{e.stopPropagation();finish()};
  el.addEventListener('click',e=>{if(e.target.closest('[data-ok]')){el.remove();done&&done();return}if(cut.classList.contains('on'))cut.classList.remove('on')});
}

function genOpp(d,usedNames){
  const D=DIFFS[d],team={};
  for(const r of['SPK','SET','DEF']){const pool=ROSTER.filter(c=>c.role===r&&D.ranks.includes(c.rank));const id=pick(pool).id;const own={lvl:Math.round(rand(D.lv[0],D.lv[1])),stars:Math.round(rand(D.stars[0],D.stars[1]))};autoAlloc(id,own);team[r]={id,own}}
  let name=pick(OPP_NAMES);if(usedNames)while(usedNames.includes(name))name=pick(OPP_NAMES);
  return{name,team,diff:d};
}
function oppOvr(o){return Math.round(['SPK','SET','DEF'].reduce((s,r)=>s+ovr(o.team[r].id,effStats(o.team[r].id,o.team[r].own)),0)/3)}
const oppCache={};
const faces=o=>['SPK','SET','DEF'].map(r=>`<img src="${portrait(o.team[r].id)}" alt="">`).join('');

  let body='';

    body=`<div class="diffs">${DIFFS.map((d,i)=>{const o=oppCache[i];return`<button class="diff" data-d="${i}" aria-pressed="${setup.diff===i}">

    ${roleChips}${fmtChips}${stChips}
    <div class="row"><button class="btn home" id="tplay" style="padding:16px;flex:1">Jouer : ${ROUNDS[t.round].toLowerCase()}</button><button class="btn small" id="tquit">Quitter la coupe</button></div>`;
  }else{
    body=`<div class="diffs" style="grid-template-columns:1fr">${TOURS.map((tt,i)=>`<button class="diff" data-tour="${i}" aria-pressed="${setup.tour===i}"><div class="row" style="justify-content:space-between"><h3 style="color:${tt.color}">${tt.name}</h3><span class="trophy num">${cupSvg(tt.color)}×${S.trophies[tt.k]}</span></div><span class="sub">${tt.diffs.map((d,j)=>ROUNDS[j]+' : '+DIFFS[d].name).join(' · ')}</span></button>`).join('')}</div>
    <p class="hint">Trois matchs à élimination directe. Une défaite et la coupe s'arrête. Gagne la finale pour la mettre en vitrine.</p>
    <button class="btn primary" id="tstart" style="padding:16px">Entrer dans la coupe</button>`;
  }
  el.innerHTML=`<div class="sec-head"><h2>Match 3v3</h2><span class="eyebrow">Ton OVR <b class="num" style="color:var(--home)">${teamOvr()}</b></span></div>
  <div class="seg"><button data-mode="friendly" aria-pressed="${setup.mode==='friendly'}">Match amical</button><button data-mode="tour" aria-pressed="${setup.mode==='tour'}">Tournoi</button></div>
  ${body}
  <details class="howto"><summary>Comment jouer</summary><ul>
    <li><b>Joue en paysage</b>, en plein écran. Joystick à gauche (ou flèches gauche/droite) pour courir, aussi en l'air.</li>
    <li><b>SAUT / SMASH</b> (Z ou Espace) : appuie pour sauter, maintiens pour monter plus haut, puis appuie à nouveau en l'air pour smasher quand le ballon arrive dans ta main.</li>
    <li><b>RÉCEPTION</b> (X ou ↓) : au sol, manchette si le ballon est bas, passe haute s'il arrive au-dessus de ta tête. Passeur : vers le filet = <b>quick</b>, vers l'arrière = <b>pipe</b>.</li>

    <li><b>Contre</b> : collé au filet, SAUT au moment où l'attaquant adverse frappe.</li>
    <li><b>Service</b> : SAUT ou RÉCEPTION pour lancer. Puis RÉCEPTION quand il redescend (service flottant), ou SAUT puis SMASH pour un service smashé.</li>
    <li><b>Pouvoirs</b> : touche un rond à gauche pour choisir ton pouvoir d'attaque, à droite ton pouvoir de défense. Il se déclenche tout seul au bon moment (bon timing, contre, défense difficile), puis se recharge en 4 points.</li>
    <li>Ta <b>note de timing</b> s'affiche au-dessus de ton joueur (PARFAIT = 108).</li>
    <li>Le ballon ne doit pas toucher le sol de ton camp ni sortir, et 3 touches maximum par camp.</li></ul></details>`;
  el.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{setup.mode=b.dataset.mode;renderSetup()});
  el.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{setup.diff=+b.dataset.d;renderSetup()});
  el.querySelectorAll('[data-fmt]').forEach(b=>b.onclick=()=>{setup.fmt=+b.dataset.fmt;renderSetup()});
  el.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{setup.stage=b.dataset.stage;renderSetup()});
  el.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{S.settings.role=b.dataset.role;save();renderSetup()});
  el.querySelectorAll('[data-tour]').forEach(b=>b.onclick=()=>{setup.tour=+b.dataset.tour;renderSetup()});
  const q=s=>el.querySelector(s);
  if(q('#reroll'))q('#reroll').onclick=()=>{oppCache[setup.diff]=genOpp(setup.diff);renderSetup()};
  if(q('#kick'))q('#kick').onclick=()=>startMatch(oppCache[setup.diff],false);
  if(q('#tstart'))q('#tstart').onclick=()=>{const tt=TOURS[setup.tour];const used=[];S.tour={k:tt.k,round:0,opps:tt.diffs.map(d=>{const o=genOpp(d,used);used.push(o.name);return o})};save();renderSetup()};
  if(q('#tplay'))q('#tplay').onclick=()=>startMatch(S.tour.opps[S.tour.round],true);
  if(q('#tquit'))q('#tquit').onclick=()=>{S.tour=null;save();renderSetup();toast('Coupe abandonnée')};
}

// Everything is synthesised with WebAudio: no audio files to ship or license.
// Buses: fx (effects + crowd) and mus (music) -> comp -> master. Settings live in their own key so the save stays untouched.
const AKEY='skyspike-audio';
let AS={fx:true,mus:true,fxVol:0.8,musVol:0.45};
try{Object.assign(AS,JSON.parse(localStorage.getItem(AKEY))||{})}catch(e){}
if(S.settings.sound===false)AS.fx=false;
function aSave(){S.settings.sound=AS.fx;try{localStorage.setItem(AKEY,JSON.stringify(AS))}catch(e){}save()}
const SND={ctx:null,master:null,fx:null,mus:null,verb:null,noise:null,crowd:null,hidden:false};
function mkImpulse(c,sec,decay){const n=Math.floor(c.sampleRate*sec),b=c.createBuffer(2,n,c.sampleRate);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,decay)}return b}
function audioInit(){
  if(!SND.ctx){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=SND.ctx=new C();
    SND.master=c.createGain();SND.master.gain.value=0.9;
    const comp=c.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.attack.value=0.004;comp.release.value=0.2;
    comp.connect(SND.master);SND.master.connect(c.destination);
    SND.fx=c.createGain();SND.mus=c.createGain();SND.fx.connect(comp);SND.mus.connect(comp);
    SND.verb=c.createConvolver();SND.verb.buffer=mkImpulse(c,1.6,3.2);const vg=c.createGain();vg.gain.value=0.22;SND.verb.connect(vg).connect(SND.fx);
    const n=c.createBuffer(1,c.sampleRate*2,c.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;SND.noise=n;
    aApply();
  }catch(e){SND.ctx=null}}
  if(SND.ctx&&SND.ctx.state==='suspended'&&!SND.hidden)SND.ctx.resume().catch(()=>{});
  music.want();
}
function aApply(){if(!SND.ctx)return;const t=SND.ctx.currentTime;SND.fx.gain.setTargetAtTime(AS.fx?AS.fxVol:0,t,0.05);SND.mus.gain.setTargetAtTime(AS.mus?AS.musVol*0.55:0,t,0.08)}
document.addEventListener('pointerdown',audioInit,{passive:true});
document.addEventListener('keydown',audioInit);
// mute when the app goes to the background (Android home button, screen off, tab switch)
document.addEventListener('visibilitychange',()=>{SND.hidden=document.hidden;if(!SND.ctx)return;if(document.hidden)SND.ctx.suspend().catch(()=>{});else SND.ctx.resume().catch(()=>{})});
window.addEventListener('pagehide',()=>{if(SND.ctx)SND.ctx.suspend().catch(()=>{})});
function sOK(){return SND.ctx&&AS.fx&&SND.ctx.state==='running'}
function out(node,wet){node.connect(SND.fx);if(wet)node.connect(SND.verb)}
function nz(t,dur,type,freq,q,gain,wet,freq2){const c=SND.ctx,s=c.createBufferSource();s.buffer=SND.noise;s.playbackRate.value=0.8+Math.random()*0.4;const f=c.createBiquadFilter();f.type=type;f.frequency.setValueAtTime(freq,t);if(freq2)f.frequency.exponentialRampToValueAtTime(freq2,t+dur);f.Q.value=q;const g=c.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+0.004);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(f).connect(g);out(g,wet);s.start(t,Math.random()*1.5);s.stop(t+dur+0.02)}
function tone(t,f0,f1,dur,gain,type,wet,att){const c=SND.ctx,o=c.createOscillator();o.type=type||'sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);const g=c.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+(att||0.005));g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);out(g,wet);o.start(t);o.stop(t+dur+0.02)}
const sfx={
  // forearm pass: soft body thud
  bump(){if(!sOK())return;const t=SND.ctx.currentTime;tone(t,150,62,0.13,0.5);nz(t,0.07,'bandpass',700,1.1,0.3);nz(t,0.03,'highpass',2500,0.7,0.06)},

  spike(str){if(!sOK())return;const t=SND.ctx.currentTime,s=Math.max(0.3,Math.min(1.6,str||1));
    nz(t,0.06+s*0.06,'highpass',2200+s*900,0.6,0.32+s*0.28,true);nz(t,0.1+s*0.1,'bandpass',1100+s*600,0.9,0.3+s*0.3,true);
    tone(t,120+s*70,38,0.16+s*0.12,0.45+s*0.4,'sine');if(s>1)tone(t,70,30,0.3,0.4,'sine');if(s>1.15)nz(t+0.02,0.5,'lowpass',900,0.5,0.18,true,180)},

  net(){if(!sOK())return;const t=SND.ctx.currentTime;for(let i=0;i<4;i++)nz(t+i*0.035,0.12,'bandpass',260+i*60,4,0.22-i*0.04);tone(t,90,60,0.25,0.15,'triangle')},

  whistle(){if(!sOK())return;const t=SND.ctx.currentTime,c=SND.ctx,o=c.createOscillator(),l=c.createOscillator(),lg=c.createGain(),g=c.createGain();o.frequency.value=2950;l.frequency.value=34;lg.gain.value=150;l.connect(lg).connect(o.frequency);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.13,t+0.02);g.gain.setValueAtTime(0.13,t+0.32);g.gain.exponentialRampToValueAtTime(0.0001,t+0.45);o.connect(g);out(g,true);o.start(t);l.start(t);o.stop(t+0.5);l.stop(t+0.5)},
  ult(){if(!sOK())return;const t=SND.ctx.currentTime;nz(t,0.6,'bandpass',300,1.4,0.25,true,4000);for(const [f,d] of[[220,0],[277,0.04],[330,0.08],[440,0.12]])tone(t+d,f,f*2,0.45,0.08,'sawtooth',true,0.05);tone(t+0.42,880,880,0.5,0.09,'triangle',true,0.01)},

  summonDrop(){if(!sOK())return;const t=SND.ctx.currentTime;nz(t,1.0,'bandpass',400,1.2,0.22,true,3200);tone(t,180,620,0.95,0.06,'triangle',false,0.6)},
  summonHit(r){if(!sOK())return;const t=SND.ctx.currentTime;tone(t,90,30,0.6,0.7);nz(t,0.4,'lowpass',2500,0.5,0.4,true,200);if(r>=3){const ch=r===4?[523,659,784,1047]:[440,554,659,880];ch.forEach((f,i)=>tone(t+0.05+i*0.06,f,f,0.9,0.06,'triangle',true,0.02))}},
  flip(){if(!sOK())return;const t=SND.ctx.currentTime;nz(t,0.05,'bandpass',2600,3,0.12);tone(t,900,1400,0.05,0.04,'triangle')},
  fanfare(r){if(!sOK())return;const t=SND.ctx.currentTime;const seq=r===4?[523,659,784,1047,1319]:[440,554,659,880];seq.forEach((f,i)=>{tone(t+i*0.09,f,f,0.35,0.09,'square',true,0.01);tone(t+i*0.09,f/2,f/2,0.35,0.06,'sawtooth',false,0.01)});tone(t+seq.length*0.09,seq[seq.length-1],seq[seq.length-1],0.9,0.1,'triangle',true,0.02)},
  // crowd: cheer + claps, intensity 0..1.5
  crowd(k){if(!sOK())return;k=Math.max(0.2,Math.min(1.5,k));const t=SND.ctx.currentTime,c=SND.ctx;
    for(const [fq,gn] of[[700,0.16],[1500,0.1]]){const s=c.createBufferSource();s.buffer=SND.noise;s.loop=true;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=fq;f.Q.value=0.5;const g=c.createGain();const dur=1.2+k*1.3;

const crowdBed={on:false,src:null,g:null,

/* ---- music: tiny step sequencer, two looping tracks ---- */
const NOTE=n=>440*Math.pow(2,(n-69)/12);
const TRACKS={
  menu:{bpm:92,bars:[[57,60,64],[53,57,60],[48,52,55],[55,59,62]],  // Am F C G
    arp:[0,1,2,1,0,2,1,2],drums:'k...s...k.k.s...',hat:'..h...h...h...h.',bass:[0,null,null,0,null,null,0,null]},
  match:{bpm:128,bars:[[50,53,57],[46,50,53],[48,52,55],[45,49,52]], // Dm Bb C A
    arp:[0,2,1,2,0,2,1,2,0,2,1,2,0,1,2,1],drums:'k.k.s..kk.k.s.k.',hat:'hhhhhhhhhhhhhhhh',bass:[0,0,null,0,12,null,0,0]}};
const music={cur:null,want_:'menu',next:0,step:0,timer:null,
  want(name){if(name)this.want_=name;if(!SND.ctx||SND.ctx.state!=='running')return;if(this.cur!==this.want_){this.cur=this.want_;this.step=0;this.next=SND.ctx.currentTime+0.12}if(!this.timer)this.timer=setInterval(()=>this.tick(),60)},
  tick(){const c=SND.ctx;if(!c||c.state!=='running')return;const tr=TRACKS[this.cur];if(!tr)return;const sp=60/tr.bpm/4;if(this.next<c.currentTime-0.05)this.next=c.currentTime+0.05;
    while(this.next<c.currentTime+0.25){this.play(tr,this.step,this.next,sp);this.step++;this.next+=sp}},

        else if(p.dive>gt){const z=zDive(p);if(zd(z)<z.r){doReceive(p,aiQ(side)*0.8,false);acted=true}}

    if(!acted)aiMoveTo(p,tx,dt);else movePlayer(p,0,dt,false);
  }
}

/* ---- ball physics ---- */
function ballStep(dt){
  const b=M.ball;
  if(b.held){const p=b.held;b.x=p.x+p.f*0.35;b.y=p.y+0.8;b.vx=0;b.vy=0;return}
  if(!b.live)return;
  const prevX=b.x;
  b.vy-=G*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.spin+=dt*Math.hypot(b.vx,b.vy)*2;
  if(prevX!==0&&b.x!==0&&Math.sign(prevX)!==Math.sign(b.x)){
    const from=sideOf(prevX),to=other(from);
    if(b.y<NET+BR){
      b.x=Math.sign(prevX)*(BR+0.02);b.vx=-b.vx*0.22;b.vy=Math.min(b.vy,0)*0.4;
      b.netT=gt;sfx.net();
    }else{
      if(b.kind==='spike'&&b.lastSide===from&&!b.noBlock){
        const D=M.t[to];
        for(const r of['DEF','SPK','SET']){
          const bl=D[r];if(bl.ground||Math.abs(bl.x)>1.2)continue;
          const top=bl.y+REACH+0.42,bot=NET-0.05;
          if(b.y<=top+0.1&&b.y>=bot){
            const tq=clamp(1-Math.abs(b.y-(top+bot)/2)/((top-bot)/2+0.15),0,1);
            const wall=useUlt(bl,'block');
            const bS=(bl.st.saut+bl.st.def)/2*(1+tr(bl,'block'))*0.85,sS=b.atkS||b.power;
            const wallSk=skConsume(to,'wall');
            let stuff=clamp(0.03+0.32*rel(bS,sS)+0.13*tq+tr(bl,'block')-(b.ult?0.4:0)+(wallSk?0.4:0),0.02,wallSk?0.85:0.5);
            if(wallSk)fx({t:'hex',x:b.x,y:b.y,z:bl.z,col:'140,220,255',dur:0.6,r:1.4});
            if(wall)stuff=0.92;
            const r2=Math.random();
            bl.lastTouchT=gt;pose(bl,'block',0.5);
            if(r2<stuff){
              b.x=prevX;b.vx=-b.vx*rand(0.18,0.35);b.vy=-rand(5,8);
              b.lastPlayer=bl;b.lastSide=to;b.kind='block';b.stuff=true;b.hitT=gt;b.power=Math.max(b.power,bS*1.2);b.touchSide=null;b.count=0;b.plan=null;
              pop('CONTRE !',bl.x,top+0.5,'#ffcf3c',1.3);M.shake=9;M.hitstop=0.12;M.zoom=1.1;M.dim=0.7;sfx.block();burst(b.x,b.y,16,'#ffcf3c',6);M.trailCol=['237,76,86','255,230,230'];
              fx({t:'ring',x:b.x,y:b.y,r0:0.2,r1:2.2,dur:0.35,col:'#ed4c56',w:5});fx({t:'star',x:b.x,y:b.y,n:12,len:1.8,dur:0.25,col:'#ffcf3c',rot:0});
              bl.stat.blk++;gainUlt(bl,1);M.assign={L:null,R:null};
              return;
            }else if(r2<stuff+0.22){
              b.vx*=0.22;b.vy=rand(2.6,4.4);b.lastPlayer=bl;b.lastSide=to;b.kind='block';b.stuff=false;b.touchSide=to;b.count=0;b.plan=null;
              pop('TOUCHÉ',bl.x,top+0.4,'#9dbcbf',0.9);sfx.bump();M.assign={L:null,R:null};
              return;
            }else b.vx*=0.92;
          }
        }
      }
      M.assign={L:null,R:null};
      if(b.plan&&b.plan.side===from)b.plan=null;
    }
  }
  if(b.y<=BR||Math.abs(b.x)>13){
    b.y=Math.max(b.y,BR);
    const landed=sideOf(b.x),inside=Math.abs(b.x)<=9+BR;
    burst(b.x,0.05,10,'#c9d6e6',3);sfx.floor();M.shake=Math.max(M.shake,3);fxLand(b.x,b.kind,Math.hypot(b.vx,b.vy));
    b.live=false;b.vx*=0.3;b.vy=2;
    if(b.kind==='toss'){scorePoint(other(b.lastSide),'SERVICE RATÉ');return}
    let w,reason,credit=null;
    if(inside){
      w=other(landed);
      if(b.lastSide===w){
        if(b.kind==='serve'){reason='ACE !';credit=b.lastPlayer;credit.stat.ace++}
        else if(b.kind==='spike'){reason=b.ult?'IMPARABLE !':'SMASH !';credit=b.lastPlayer}
        else if(b.kind==='block'){reason='CONTRE !';credit=b.lastPlayer}
        else if(b.kind==='feint'){reason='FEINTE !';credit=b.lastPlayer}
        else reason='POINT';
      }else reason=gt-(b.netT||-9)<2?(b.kind==='serve'?'SERVICE DANS LE FILET':'DANS LE FILET'):b.kind==='serve'?'FAUTE DE SERVICE':'BALLE AU SOL';
    }else{w=other(b.lastSide||landed);reason='DEHORS'}
    if(!credit&&(b.kind==='bump'||b.kind==='pass')&&b.lastSide!==w&&b.lastAtk&&b.lastAtk.side===w&&b.count<=1){credit=b.lastAtk;reason=b.lastAtk.c&&reason==='DEHORS'?'DÉFENSE RATÉE':reason}
    dbg('LAND',b.x.toFixed(1),'kind',b.kind,'last',b.lastSide,reason);
    scorePoint(w,reason,credit);
  }
}

/* ---- loop ---- */
function frame(now){
  requestAnimationFrame(frame);
  if(!lastNow)lastNow=now;
  let dt=Math.min(0.05,(now-lastNow)/1000);lastNow=now;
  if(!M.active||!W||M.paused||curView!=='match')return;
  if(M.cutin&&performance.now()-M.cutin.t0<1000)dt*=0.05;
  step(dt);render();
}
function step(dt){
  if(M.hitstop>0){M.hitstop-=dt;return}
  if(M.slow>gt)dt*=0.42;
  const sub=Math.max(2,Math.ceil(dt/0.006)),h=dt/sub;
  for(let i=0;i<sub;i++){
    gt+=h;
    if(M.state==='live'||M.state==='serve'){
      if(isHumanP(M.human))humanUpdate(M.human,h);
      aiTeam('L',h);aiTeam('R',h);
      ballStep(h);
      if(M.state==='live'&&gt-M.rallyT>90){M.state='dead';M.stateT=gt;pop('POINT REJOUÉ',0,4,'#9dbcbf');M.replay=true}
    }else{
      for(const p of M.players){p.vx*=0.8;movePlayer(p,0,h,false)}
      const b=M.ball;if(!b.held){b.vy-=G*h;b.x+=b.vx*h;b.y+=b.vy*h;if(b.y<BR){b.y=BR;b.vy=Math.abs(b.vy)*0.45;b.vx*=0.7}}
    }
  }
  if(M.state==='dead'&&gt-M.stateT>1.5){if(M.replay){M.replay=false;newPoint(M.serving)}else afterDead()}
  if(M.state==='pause'&&gt-M.stateT>1.6)newPoint(M.serving);
  for(const p of M.players)if(p.poseT<gt&&p.pose!=='idle')p.pose=p.ground?'idle':'jump';
  for(const pa of M.parts){pa.vy-=(pa.g==null?9:pa.g)*dt;pa.x+=pa.vx*dt;pa.y+=pa.vy*dt}
  M.parts=M.parts.filter(pa=>gt-pa.t0<pa.life);
  fxTick(dt);
  const b=M.ball;
  crowdBed.level(M.state==='live'?0.02+Math.min(0.06,(gt-M.rallyT)*0.006):0.014);
  const lim=Math.max(0,(M.state==='serve'?12.2:10.4)-VIEWW/2);
  const focus=M.state==='serve'?sgn(M.serving)*6.5:b.x*0.6+(isHumanP(M.human)?M.human.x*0.25:0);
  M.camX+=(clamp(focus,-lim,lim)-M.camX)*Math.min(1,dt*3.2);
  hudUpdate();
}
let hudT=-1;
function hudUpdate(){
  if(Math.abs(gt-hudT)<0.12)return;hudT=gt;
  let t='';
  const p=M.human,b=M.ball;
  if(isHumanP(p)){
    const r=M.resp.L;
    if(M.state==='serve'&&M.serving==='L'&&server('L')===p)t=M.serveTossT?'<b>RÉCEPTION</b> quand il redescend · ou <b>SAUT</b> puis <b>SMASH</b>':'<b>SAUT</b> ou <b>RÉCEPTION</b> pour lancer le ballon';
    else if(M.state==='live'&&r&&r.p===p){
      t=r.mode==='rec'?'À toi ! Mets-toi sur le cercle et <b>RÉCEPTION</b> · trop loin : <b>PLONGEON</b>':(r.mode==='set'||r.mode==='bset')?'Passe ! <b>RÉCEPTION</b> sous le ballon · vers le filet = quick · arrière = pipe':r.mode==='atk'?'Smash ! <b>SAUT</b> puis appuie encore en l\'air · <b>FEINTE</b> pour placer':'Renvoie-le chez eux : <b>RÉCEPTION</b>';
    }else if(M.state==='live'&&b.plan&&b.plan.side==='R')t=Math.abs(p.x)<1.4?'Attaque adverse : <b>SAUT</b> pour contrer':'Attaque adverse : replace-toi';
  }else t='Mode spectateur';
  const el=$('#tip');if(el.innerHTML!==t)el.innerHTML=t;
  if(p&&p.ultOn){$('#ultfill').style.width=(p.ult*100)+'%';$('#ultbar').classList.toggle('full',p.ult>=1)}
  skUI();
}

    if(M.overT&&M.overT[p.side]>gt&&Math.abs(p.vx)>1&&Math.random()<0.4)emit(p.x-Math.sign(p.vx)*0.3,p.y+rand(0.2,0.9),p.z,'rgba(190,240,255,.8)',1,{spd:0.3,vx:-p.vx*0.4,g:0,streak:1,life:0.35})
    if(p.boosting&&gt-p.boosting<0.05){emit(p.x,p.y+0.1,p.z,e?`rgb(${e.c})`:'rgba(255,207,60,.9)',2,{spd:1.5,g:4,life:0.6,size:1.2})}
  }
  const b=M.ball;
  if(b.live&&M.trailEl&&Math.hypot(b.vx,b.vy)>8){const e=M.trailEl,k=e.k;
    if(k==='flame'){emit(b.x,b.y,b.z,'rgb(255,170,60)',2,{spd:0.6,g:-3,size:1.6,life:0.8});emit(b.x,b.y,b.z,'rgb(255,80,30)',1,{spd:0.4,g:-2,size:2,life:0.7})}
    else if(k==='thunder'){if(!M.boltT||gt-M.boltT>0.06){M.boltT=gt;const a=rand(0,Math.PI*2);fx({t:'bolt',x0:b.x,y0:b.y,x1:b.x+Math.cos(a)*0.7,y1:b.y+Math.sin(a)*0.7,z:b.z,col:e.c,dur:0.12,w:2})}}

    else emit(b.x,b.y,b.z,`rgb(${e.c2})`,1,{spd:1,g:0,size:0.8,life:0.7});
  }

  if(st===STAGES.gym&&Math.random()<dt*4)emit(M.camX+rand(-8,8),rand(2,6),rand(0.3,1.4),'rgba(255,240,210,.4)',1,{spd:0.1,g:0.05,life:4,size:0.4});
  M.tilt=(M.tilt||0)*Math.pow(0.06,dt);
  const tz=ballTargetZ();b.tz=tz;b.z+=(tz-b.z)*Math.min(1,dt*3.2);

  b.trail.push({x:b.x,y:b.y,z:b.z});const keep=hot?12:8;while(b.trail.length>keep)b.trail.shift();

  if(b.live&&sp>16&&(!M.windT||gt-M.windT>0.07)){M.windT=gt;fx({t:'wind',x:b.x,y:b.y,z:b.z,ang:Math.atan2(b.vy,b.vx),dur:0.4})}
  at(0.5);const visH=(FLOOR-K*0.6)/K;const hiY=Math.max(0,b.y-visH*0.72)*0.85;M.camY=(M.camY||0)+(hiY-(M.camY||0))*Math.min(1,dt*3);
}
/* ---- finish ---- */
function finish(w){
  setTimeout(()=>{
    if(!M.active)return;
    const won=w==='L';
    if(won)S.wins++;else S.losses++;
    let tourMsg='',nextOpp=null;
    if(M.tour&&S.tour){
      const t=S.tour,T0=TOURS.find(x=>x.k===t.k);
      if(won){if(t.round>=2){S.trophies[t.k]++;tourMsg=`<div class="trophy" style="font-size:20px;color:${T0.color}">${cupSvg(T0.color)} ${T0.name} remportée !</div>`;S.tour=null}else{t.round++;nextOpp=t.opps[t.round];tourMsg=`<div class="eyebrow" style="color:var(--accent)">Qualifié · prochain tour : ${ROUNDS[t.round].toLowerCase()}</div>`}}
      else{tourMsg=`<div class="eyebrow">Éliminé en ${ROUNDS[t.round].toLowerCase()}</div>`;S.tour=null}
    }
    save();
    const rows=M.players.filter(p=>p.side==='L').map(p=>`<tr><td>${esc(p.c.name)} <span style="color:var(--muted)">${ROLES[p.role].short}${isHumanP(p)?' · toi':''}</span></td><td class="num">${p.stat.pts}</td><td class="num">${p.stat.blk}</td><td class="num">${p.stat.ace}</td><td class="num">${p.stat.dig}</td></tr>`).join('');
    const again=M.tour?(nextOpp?'Match suivant':null):'Revanche';
    $('#result-box').innerHTML=`<span class="eyebrow">${esc(M.oppName)} · ${M.diff.name}</span>
      <h2 class="${won?'win':'lose'}">${won?'Victoire':'Défaite'}</h2>${tourMsg}
      <div class="num" style="font-family:var(--display);font-size:20px">${M.setLog.join(' · ')}</div>
      <table><thead><tr><th>Joueur</th><th>Pts</th><th>Contres</th><th>Aces</th><th>Déf.</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="row">${again?`<button class="btn home" id="r-again">${again}</button>`:''}<button class="btn" id="r-up">Améliorer</button><button class="btn small" id="r-back" style="margin-left:auto">Fermer</button></div>`;
    $('#result').hidden=false;
    const ra=$('#r-again');if(ra)ra.onclick=()=>{$('#result').hidden=true;if(M.tour)startMatch(nextOpp,true);else startMatch(M.opp,false)};
    $('#r-up').onclick=()=>{$('#result').hidden=true;leaveMatch();show('roster')};
    $('#r-back').onclick=()=>{$('#result').hidden=true;leaveMatch()};
  },900);
}

  const off=()=>{btn.classList.remove('on');setKey(k,false)};
  btn.addEventListener('pointerup',off);btn.addEventListener('pointercancel',off);btn.addEventListener('lostpointercapture',off);

});
{
  const sz=$('#stickzone'),sb=$('#stickbase'),sk=$('#stickknob');

  sz.addEventListener('pointermove',e=>{if(e.pointerId===stick.id)upd(e)});

const KMAP={ArrowLeft:'left',KeyA:'left',KeyQ:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',KeyZ:'jump',Space:'jump',KeyJ:'act',KeyX:'act',ArrowDown:'act',KeyS:'act',KeyK:'feint',KeyC:'feint'};
