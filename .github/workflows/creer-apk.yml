
name: Compiler SkySpike en APK

on:
  push:
    branches:
      - main
    # Le jeu (index.html) se met a jour tout seul dans l'appli :
    # on ne recompile l'APK que si le lanceur ou ce workflow changent.
    paths:
      - 'app/**'
      - '.github/workflows/creer-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  creer-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Recuperer le jeu
        uses: actions/checkout@v4

      - name: Preparer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preparer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparer Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Installer Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Creer le projet Android
        shell: bash
        run: |
          set -euxo pipefail
          test -s index.html
          test -s app/loader.html
          mkdir -p www
          # Lanceur qui telecharge la derniere version du jeu a chaque demarrage
          cp app/loader.html www/index.html
          # Copie embarquee du jeu, utilisee hors connexion au premier lancement
          cp index.html www/game.html

          cat > package.json <<'PACKAGE'
          {
            "name": "skyspike",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "8.5.3",
              "@capacitor/android": "8.5.3"
            },
            "devDependencies": {
              "@capacitor/cli": "8.5.3"
            }
          }
          PACKAGE

          cat > capacitor.config.json <<'CONFIG'
          {
            "appId": "com.skyspike.game",
            "appName": "SkySpike",
            "webDir": "www",
            "android": {
              "backgroundColor": "#081634"
            }
          }
          CONFIG

          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

          # Jeu en paysage plein ecran
          MANIFEST=android/app/src/main/AndroidManifest.xml
          perl -0pi -e 's/<activity(\s)/<activity android:screenOrientation="sensorLandscape"$1/' "$MANIFEST"
          if grep -q sensorLandscape "$MANIFEST"; then echo "Orientation paysage OK"; else echo "::warning::Orientation paysage non appliquee"; fi

      - name: Compiler APK Android
        shell: bash
        run: |
          set -euo pipefail
          # Cle de signature fixe : les prochains APK s'installeront par-dessus sans desinstaller
          mkdir -p ~/.android
          cp app/debug.keystore ~/.android/debug.keystore
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../SkySpike.apk

      - name: Publier APK
        uses: actions/upload-artifact@v7
        with:
          name: SkySpike-APK
          path: SkySpike.apk
          archive: false
          if-no-files-found: error
          retention-days: 30
