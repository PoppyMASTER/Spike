name: Compiler SkySpike Godot (prototype)

on:
  push:
    branches:
      - main
    paths:
      - 'godot/**'
      - 'server/**'
      - 'app/debug.keystore'
      - '.github/workflows/godot-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Preparer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparer Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Installer les outils Android
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-dl
          key: godot-${{ env.GODOT_VERSION }}

      - name: Telecharger Godot et les modeles d'export
        if: steps.cache-godot.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/godot-dl && cd ~/godot-dl
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"

      - name: Installer Godot
        shell: bash
        run: |
          set -euo pipefail
          cd ~/godot-dl
          unzip -o -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" ~/godot
          chmod +x ~/godot
          tdir=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$tdir" /tmp/tpl
          unzip -o -q templates.tpz -d /tmp/tpl
          cp /tmp/tpl/templates/android_* "$tdir"/
          cp /tmp/tpl/templates/version.txt "$tdir"/
          ls -la "$tdir"
          # Editor settings: Android SDK, Java and the shared debug key (same as the web launcher APK)
          mkdir -p ~/.config/godot
          minor=$(echo "$GODOT_VERSION" | cut -d. -f1,2)
          cat > ~/.config/godot/editor_settings-${minor}.tres <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${GITHUB_WORKSPACE}/app/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
          sed -i 's/^ *//' ~/.config/godot/editor_settings-${minor}.tres
          cat ~/.config/godot/editor_settings-${minor}.tres

      - name: Verifier la compatibilite des mises a jour
        shell: bash
        run: |
          # the autoload list is read from the installed APK: a pack that changes it breaks old installs.
          # Changing it requires updating godot/autoloads.lock AND raising godot/min_apk.txt.
          sed -n '/^\[autoload\]/,/^\[/p' godot/project.godot | grep '=' > /tmp/autoloads.now
          diff -u godot/autoloads.lock /tmp/autoloads.now

      - name: "Serveur social 1/4 : dependances"
        id: cf_npm
        if: env.HAS_CF == 'true'
        continue-on-error: true
        working-directory: server
        run: npm ci --no-audit --no-fund

      - name: "Serveur social 2/4 : connexion au compte"
        id: cf_auth
        if: steps.cf_npm.outcome == 'success'
        continue-on-error: true
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          npx wrangler whoami > w.log 2>&1
          code=$?
          grep -qi "not authenticated\|invalid.*token\|Authentication error" w.log && echo "reason=auth" >> $GITHUB_OUTPUT
          grep -qi "more than one account\|multiple accounts" w.log && echo "reason=accounts" >> $GITHUB_OUTPUT
          rm -f w.log
          exit $code

      - name: "Serveur social 3/4 : tables"
        id: cf_db
        if: steps.cf_auth.outcome == 'success'
        continue-on-error: true
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # tables are created only if missing: safe on every build
        run: |
          set +e
          npx wrangler d1 execute skyspike-social --remote --file schema.sql > d.log 2>&1
          code=$?
          grep -qi "not authorized\|Authentication\|code: 10000\|permission" d.log && echo "reason=perm" >> $GITHUB_OUTPUT
          grep -qi "not found\|Couldn't find" d.log && echo "reason=notfound" >> $GITHUB_OUTPUT
          rm -f d.log
          exit $code

      - name: "Serveur social 4/4 : deploiement"
        id: cf_deploy
        if: steps.cf_auth.outcome == 'success'
        continue-on-error: true
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          npx wrangler deploy > deploy.log 2>&1
          code=$?
          grep -qi "workers.dev subdomain\|register a workers.dev" deploy.log && echo "reason=subdomain" >> $GITHUB_OUTPUT
          grep -qi "not authorized\|Authentication error\|code: 10000" deploy.log && echo "reason=perm" >> $GITHUB_OUTPUT
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          rm -f deploy.log
          set -e
          test $code -eq 0
          test -n "$url"
          echo "{\"url\": \"$url\"}" > ../godot/data/server.json
          curl -fsS "$url/v1" > /dev/null

      # markers: their success/skip tells which deploy stage failed and why (no logs exposed)
      - name: "ECHEC dependances"
        if: steps.cf_npm.outcome == 'failure'
        run: "true"
      - name: "ECHEC connexion compte"
        if: steps.cf_auth.outcome == 'failure'
        run: "true"
      - name: "ECHEC connexion : jeton invalide"
        if: steps.cf_auth.outputs.reason == 'auth'
        run: "true"
      - name: "ECHEC connexion : plusieurs comptes"
        if: steps.cf_auth.outputs.reason == 'accounts'
        run: "true"
      - name: "ECHEC tables"
        if: steps.cf_db.outcome == 'failure'
        run: "true"
      - name: "ECHEC tables : permission D1"
        if: steps.cf_db.outputs.reason == 'perm'
        run: "true"
      - name: "ECHEC tables : base introuvable"
        if: steps.cf_db.outputs.reason == 'notfound'
        run: "true"
      - name: "ECHEC deploiement"
        if: steps.cf_deploy.outcome == 'failure'
        run: "true"
      - name: "ECHEC deploiement : sous-domaine workers.dev a creer"
        if: steps.cf_deploy.outputs.reason == 'subdomain'
        run: "true"
      - name: "ECHEC deploiement : permission"
        if: steps.cf_deploy.outputs.reason == 'perm'
        run: "true"
      - name: "OK serveur social en ligne"
        if: steps.cf_deploy.outcome == 'success'
        run: "true"

      - name: Exporter l'APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/app/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          cd godot
          mkdir -p build
          # build number = run number: the app compares it with the published pack
          echo "${{ github.run_number }}" > build.txt
          ~/godot --headless --path . --import || true
          ~/godot --headless --path . --export-debug "Android" build/SkySpike-Godot.apk
          # resource pack for updates without reinstalling
          ~/godot --headless --path . --export-pack "Android" build/update.pck
          printf '{"build": %s, "pck": "update.pck", "min_apk": %s}' "${{ github.run_number }}" "$(cat min_apk.txt)" > build/manifest.json
          ls -la build
          test -s build/SkySpike-Godot.apk
          test -s build/update.pck
          # the APK must be allowed to use the network (updates, online play)
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions build/SkySpike-Godot.apk | tee /dev/stderr | grep -q "android.permission.INTERNET"

      - name: Publier l'APK
        uses: actions/upload-artifact@v7
        with:
          name: SkySpike-Godot-APK
          path: godot/build/SkySpike-Godot.apk
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Publier la mise a jour (release godot-latest)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd godot/build
          if ! gh release view godot-latest >/dev/null 2>&1; then
            gh release create godot-latest --title "SkySpike Godot (derniere version)" \
              --notes "Mise a jour automatique. L'appli telecharge update.pck toute seule ; SkySpike-Godot.apk sert seulement pour la premiere installation." --prerelease
          fi
          gh release upload godot-latest update.pck SkySpike-Godot.apk --clobber
          # manifest last, so the app never sees a build number before its pack is online
          gh release upload godot-latest manifest.json --clobber
          # build number also in the title: fallback read by the app through the GitHub API
          gh release edit godot-latest --title "SkySpike Godot build ${{ github.run_number }}"
